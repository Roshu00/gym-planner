name: chalkline
description: "Chalkline: creator workout programs for followers. Design system and component gallery."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage-Text-400.ttf
          weight: 400
        - asset: assets/fonts/Bricolage-Text-500.ttf
          weight: 500
        - asset: assets/fonts/Bricolage-Text-600.ttf
          weight: 600
        - asset: assets/fonts/Bricolage-Text-700.ttf
          weight: 700
        - asset: assets/fonts/Bricolage-Text-800.ttf
          weight: 800
    - family: BricolageDisplay
      fonts:
        - asset: assets/fonts/Bricolage-Display-700.ttf
          weight: 700
        - asset: assets/fonts/Bricolage-Display-800.ttf
          weight: 800
    - family: PhosphorRegular
      fonts:
        - asset: assets/icons/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/icons/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/icons/Phosphor-Bold.ttf
