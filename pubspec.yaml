name: chalkline
description: "Chalkline: creator workout programs for followers. Design system and component gallery."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
    - family: PhosphorLight
      fonts:
        - asset: assets/icons/Phosphor-Light.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/icons/Phosphor-Bold.ttf
