<!--
  ════════════════════════════════════════════════════════════════════════
  KAKO SE KORISTI
  1. Kopiraj ovaj fajl za svakog trenera (npr. jelena.html).
  2. Promeni samo blok TRAINER ispod: tekst, brojeve i linkove ka slikama.
     Slike mogu biti linkovi (https://...) ili fajlovi pored ovog fajla
     (npr. "slike/jelena.jpg").
  3. Otvori fajl u Chrome-u. "Prezentacija" je stranica za trenera: šta je
     Chalkline, kako ga nalaze, kako pratioci treniraju i koliko može da
     zaradi. "Samo ekrani" su ekrani za izvoz; tamo dugmad biraju ekran i
     pozadinu.
     "Story 9:16" je sama kartica za Instagram story, bez telefona; uvećaj
     sliku 2× pri izvozu da dobiješ 1080 × 1920.
  4. Za sliku jednog ekrana: "Samo jedan ekran" + "Bez pozadine", pa
     desni klik > Inspect > desni klik na .phone > "Capture node screenshot".
     Ili obična slika ekrana.
  Ekrani su iste veličine kao iPhone 17 Pro (402 × 874), boje i font su
  isti kao u aplikaciji (lib/ui/tokens).
  ════════════════════════════════════════════════════════════════════════
-->

function shareCard(scale = 1) {
  const m = T.summary;
  const tile = (label, value, bgc, fg, big) => `<div style="background:${bgc};color:${fg};border-radius:${20 * scale}px;padding:${14 * scale}px">
      <div class="label" style="color:${fg};font-size:${12 * scale}px;line-height:${16 * scale}px">${label}</div>
      <div class="num" style="font-weight:800;letter-spacing:-.03em;white-space:nowrap;font-size:${(big ? 40 : 26) * scale}px;line-height:${(big ? 42 : 28) * scale}px">${esc(value)}</div>
    </div>`;
  const second = m.records > 0 ? tile("Rekordi", `${m.records} PR`, "var(--peach)", "var(--ink)") : tile("Setova", m.sets ?? "—", "var(--peach)", "var(--ink)");
  return `<div style="background:var(--lilac);border-radius:${28 * scale}px;padding:${24 * scale}px ${20 * scale}px ${20 * scale}px;color:var(--ink)">
    <div class="strong" style="font-size:${13 * scale}px;line-height:${18 * scale}px">${esc(m.workout)} · ${esc(m.duration)}</div>
    <div style="font-size:${56 * scale}px;line-height:${54 * scale}px;font-weight:800;letter-spacing:-.04em;font-variation-settings:'opsz' 96;margin-top:${8 * scale}px">${esc(m.headline)}</div>
    <div style="display:grid;gap:${8 * scale}px;margin-top:${24 * scale}px">
      ${tile("Volumen", m.volume, "var(--lime)", "var(--ink)", true)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:${8 * scale}px">${second}${tile("Niz", m.streak, "var(--ink)", "#fff")}</div>
    </div>
    <div style="display:flex;align-items:center;gap:${8 * scale}px;margin-top:${24 * scale}px">
      <span class="avatar" style="width:${28 * scale}px;height:${28 * scale}px;${bg(T.photo)}"></span>
      <span class="strong" style="flex:1;font-size:${13 * scale}px">@${esc(T.handle)}</span>
      <span class="strong" style="font-size:${13 * scale}px">Chalkline</span>
    </div>
  </div>`;
}

// Nalepnica preko slike pratioca, ista kao u aplikaciji (lib/app/story_share.dart):
// beli tekst bez pozadine, sa senkom. [scale] je 1 za story širok 360 pt.
function sticker(scale = 1) {
  const m = T.summary;
  const stat = (label, value) => `<div style="flex:1;min-width:0"><div style="font:700 ${11 * scale}px var(--font)">${label}</div><div class="num" style="font-weight:800;letter-spacing:-.03em;font-size:${24 * scale}px;line-height:1.1;white-space:nowrap">${esc(value)}</div></div>`;
  const third = m.records > 0 ? stat("Rekordi", m.records) : stat("Setova", m.sets ?? "—");
  return `<div class="sticker-text" style="display:grid;gap:${12 * scale}px">
    <div style="font-size:${40 * scale}px;line-height:1;font-weight:800;letter-spacing:-.035em;font-variation-settings:'opsz' 96">${esc(m.workout)}</div>
    <div style="display:flex;gap:${12 * scale}px">${stat("Vreme", m.duration)}${stat("Volumen", m.volume)}${third}</div>
    <div style="display:flex;align-items:center;gap:${8 * scale}px"><span class="avatar" style="width:${22 * scale}px;height:${22 * scale}px;${bg(T.photo)}"></span><span style="font:700 ${13 * scale}px var(--font)">@${esc(T.handle)} · Chalkline</span></div>
  </div>`;
}

// 540 px wide is half of 1080 × 1920; the presentation shows it phone-sized.

    <div style="position:absolute;left:${22 * k}px;right:${22 * k}px;bottom:${48 * k}px;z-index:1">${sticker(k)}</div>

}

function discoverBrowseScreen() {
  const all = [{ name: T.name, handle: T.handle, tagline: T.tagline, followers: T.followers, photo: T.photo }, ...T.search.others];
  const rows = all.map((c) => `<div class="tile" style="display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px">
      <span class="avatar" style="width:44px;height:44px;${bg(c.photo)}"></span>
      <div style="flex:1;min-width:0"><div class="strong">${esc(c.name)}</div><div class="body" style="font-size:13px;line-height:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">@${esc(c.handle)} · ${esc(c.tagline)}</div></div>
      <div style="text-align:right"><div class="strong num">${esc(c.followers)}</div><div class="label">pratilaca</div></div>
    </div>`).join("");
  return `${status(false)}
  <div class="content">
    <div class="pad" style="padding-top:72px;display:grid;gap:12px">
      <div><div class="label">Treneri i programi</div><div class="display-l" style="margin-top:2px">Otkrij</div></div>
      <div style="display:flex;align-items:center;gap:10px;background:var(--raised);border-radius:12px;height:52px;padding:0 16px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="body" style="color:var(--muted)">Pretraži trenere i programe</span>
      </div>
      <div class="btn dark" style="height:48px;font-size:16px">Pronađi plan za sebe</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:8px"><span class="display-m" style="font-size:22px">Treneri</span><span class="label">${all.length}</span></div>
      ${rows}
    </div>
  </div>
  ${nav(2)}`;
}

const phone = (fn, id) => `<div class="phone" ${id ? `id="${id}"` : ""}><div class="screen">${fn()}</div></div>`;
const money = (n) => new Intl.NumberFormat("sr-RS", { maximumFractionDigits: 0 }).format(n) + " €";

// ───────── Prezentacija za trenera

          ${T.compare.map(([n, c, x]) => `<tr><td><b>${esc(n)}</b></td><td>${esc(c)}</td><td style="color:var(--muted)">${esc(x)}</td></tr>`).join("")}

        <p class="lead">Primamo ${esc(O.spots)} trenera. Oni oblikuju aplikaciju i prvi su koje pratioci vide.</p></div>
      <div class="points">${O.perks.map(([t, d]) => `<div class="point"><b>${esc(t)}</b><p>${esc(d)}</p></div>`).join("")}</div>
      <div class="timeline">${O.timeline.map(([t, d], i) => `<div class="${i === 0 ? "now" : ""}"><b>${esc(t)}</b><span class="lead" style="font-size:16px;line-height:24px">${esc(d)}</span></div>`).join("")}</div>
    </section>

    <section class="sec">
      <div class="sec-head"><span class="eyebrow">Kako počinješ</span><h2 class="h2">Za jedno popodne, ${esc(first)}.</h2></div>

        <div class="point"><span class="n">1</span><b>Javiš nam se</b><p>Kratak razgovor, otvorimo ti nalog u probnoj verziji.</p></div>

      <p class="lead" style="color:rgba(250,248,244,.75)">Javi nam se i otvaramo ti nalog u probnoj verziji ove nedelje.</p>
      <span class="mail">${esc(O.contact)}</span>
    </section>
  </div>`;
}

function wireCalc() {
  const input = document.getElementById("rate");
  if (!input) return;
  const update = () => {
    const rate = Number(input.value) / 100;
    const subs = Math.round(T.followersCount * rate);
    const gross = subs * T.price;
    const mine = gross * (1 - (1 - T.offer.foundingShare));
    document.getElementById("pct").textContent = `${String(input.value).replace(".", ",")}%`;
    document.getElementById("subs").textContent = `${new Intl.NumberFormat("sr-RS").format(subs)} pretplatnika`;
    document.getElementById("month").textContent = money(mine);
    document.getElementById("year").textContent = money(mine * 12);
    document.getElementById("gross").textContent = money(gross);
  };
  input.addEventListener("input", update);
  update();
}

const SCREENS = [
  { id: "otkrij", title: "Otkrij", render: discoverBrowseScreen },
  { id: "pretraga", title: "Pretraga", render: discoverScreen },
  { id: "profil", title: "Profil trenera", render: profileScreen },
  { id: "program", title: "Program", render: programScreen },
  { id: "danas", title: "Danas, kod pratioca", render: todayScreen },
  { id: "trening", title: "Trening", render: workoutScreen },
  { id: "rezime", title: "Rezime", render: summaryScreen },
  { id: "podeli", title: "Podeli na story", render: composerScreen },
  { id: "story", title: "Story 9:16", render: storyFrame, bare: true }
];

let only = null;
let mode = "deck";
function draw() {
  const modes = `<button class="${mode === "deck" ? "on" : ""}" data-mode="deck">Prezentacija</button><button class="${mode === "screens" ? "on" : ""}" data-mode="screens">Samo ekrani</button><span style="width:16px"></span>`;
  if (mode === "deck") {
    document.getElementById("stage").innerHTML = deck();
    document.getElementById("toolbar").innerHTML = modes;
    wireCalc();
    return;
  }
  document.getElementById("stage").innerHTML = SCREENS
    .filter((s) => !only || s.id === only)
    .map((s) => s.bare
      ? `<div class="slot">${s.render()}<div class="caption">${s.title}</div></div>`
      : `<div class="slot"><div class="phone" id="${s.id}"><div class="screen">${s.render()}</div></div><div class="caption">${s.title}</div></div>`)
    .join("");
  document.getElementById("toolbar").innerHTML = modes +
    `<button class="${only ? "" : "on"}" data-only="">Svi ekrani</button>` +
    SCREENS.map((s) => `<button class="${only === s.id ? "on" : ""}" data-only="${s.id}">${s.title}</button>`).join("") +
    `<button data-clean>${document.body.classList.contains("clean") ? "Sa pozadinom" : "Bez pozadine"}</button>`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.mode) mode = b.dataset.mode;
  else if (b.hasAttribute("data-clean")) document.body.classList.toggle("clean");
  else only = b.dataset.only || null;
  draw();
});
draw();
</script>
</body>
