<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalkline · Minja Varsaković</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">

<!--
  ════════════════════════════════════════════════════════════════════════
  KAKO SE KORISTI
  1. Kopiraj ovaj fajl za svakog trenera (npr. jelena.html).
  2. Promeni samo blok TRAINER ispod: tekst, brojeve i linkove ka slikama.
     Slike mogu biti linkovi (https://...) ili fajlovi pored ovog fajla
     (npr. "slike/jelena.jpg").
  3. Otvori fajl u Chrome-u. Dugmad gore biraju ekran i pozadinu.
     "Story 9:16" je sama kartica za Instagram story, bez telefona; uvećaj
     sliku 2× pri izvozu da dobiješ 1080 × 1920.
  4. Za sliku jednog ekrana: "Samo jedan ekran" + "Bez pozadine", pa
     desni klik > Inspect > desni klik na .phone > "Capture node screenshot".
     Ili obična slika ekrana.
  Ekrani su iste veličine kao iPhone 17 Pro (402 × 874), boje i font su
  isti kao u aplikaciji (lib/ui/tokens).
  ════════════════════════════════════════════════════════════════════════
-->
<script>
const TRAINER = {
  name: "Minja Varsaković",
  handle: "minjavarsakovicc",
  tagline: "Glutelab",
  bio: "Personalni treninzi u Beauty & Beast womens gym. Glutelab je moj program za snažne noge i gluteus, trening po trening, kao da sam sa tobom u teretani.",
  photo: "slike/minja/profil.jpg",
  avatar: "slike/minja/avatar.jpg",   // mala okrugla slika; ako je nema, koristi se photo
  followers: "142K",                  // Instagram 41,5K + TikTok 101K
  priceMonthly: "4,99 €",

  // Programi redom kako treba da stoje na profilu. Prvi je i "preporučen".
  programs: [
    {
      name: "Glutelab",
      weeks: 8, perWeek: 4, level: "Srednji", place: "Teretana",
      cover: "slike/minja/glutelab.jpg",
      forSubscribers: false,
      workouts: [
        { name: "Quad day", minutes: 45, exercises: 5, cover: "slike/minja/quad-day.jpg" },
        { name: "Gornji deo", minutes: 40, exercises: 5, cover: "slike/minja/gornji-deo.jpg" },
        { name: "Leđa i ramena", minutes: 40, exercises: 5, cover: "slike/minja/ledja.jpg" }
      ]
    },
    {
      name: "Glutelab 2",
      weeks: 8, perWeek: 4, level: "Svi nivoi", place: "Kod kuće",
      cover: "slike/minja/glutelab2.jpg",
      forSubscribers: true,
      workouts: []
    }
  ],

  // Ekran "Danas": trening dana i jedna rečenica trenera.
  today: {
    workout: "Leđa i ramena",
    minutes: 40,
    intro: "Leđa danas. Kontrolisano na povlačenju, jako do poslednjeg seta.",
    cover: "slike/minja/danas.jpg",
    followerName: "Ana"
  },

  // Ekran treninga: vežba koja se radi.
  exercise: {
    name: "Gobl čučanj",
    sets: 4, reps: "12–10–8–6", rest: "1:30", kg: "16", repsNow: 10,
    cue: "Pete na pločicama, grudi gore, spusti se duboko.",
    picture: "slike/minja/gobl-cucanj.jpg"
  },

  // Rezime posle treninga i story kartica koju pratilac deli.
  summary: {
    workout: "Quad day",
    duration: "46 min",
    headline: "Odrađeno.",
    volume: "4.120 kg",
    records: 2,
    streak: "3 ned.",
    finishMessage: "Ovako se grade noge. Odmori se, vidimo se na sledećem Glutelab treningu.",
    exercises: [
      { name: "Leg press", detail: "4 seta · najbolji 80 kg × 6", pr: true },
      { name: "Gobl čučanj", detail: "4 seta · najbolji 16 kg × 10", pr: true },
      { name: "Iskoraci u hodu", detail: "3 seta · 10 po nozi", pr: false },
      { name: "Opružanje nogu", detail: "4 seta · 30 s izdržaj + 10", pr: false }
    ]
  }
};
</script>

<style>
  :root {
    /* Iste boje kao u aplikaciji (lib/ui/tokens/colors.dart). */
    --bg: #FAF8F4; --surface: #FFFFFF; --raised: #EFECE5; --border: #E6E2D8;
    --ink: #111111; --muted: #5A5750;
    --lime: #D4F54A; --lilac: #C9B6FF; --peach: #FFC6A3;
    --scrim: rgba(0,0,0,.55); --shadow: 0 6px 18px -6px rgba(59,52,38,.12), 0 1px 3px rgba(59,52,38,.06);
    --stage: #E9E5DC;
    --font: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font); background: var(--stage); color: var(--ink); padding: 24px 16px 64px; }
  body.clean { background: transparent; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 28px; }
  .toolbar button { font: 600 14px var(--font); border: 1.5px solid var(--ink); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .toolbar button.on { background: var(--ink); color: var(--bg); }
  body.clean .toolbar { opacity: .25; }
  .stage { display: flex; flex-wrap: wrap; gap: 36px; justify-content: center; align-items: flex-start; }
  .slot { display: grid; gap: 12px; justify-items: center; }
  .caption { font: 700 15px var(--font); color: var(--muted); }
  body.clean .caption { display: none; }

  /* Telefon */
  .phone { width: 422px; padding: 10px; background: #0B0B0B; border-radius: 62px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.35); flex: none; }
  .screen { position: relative; width: 402px; height: 874px; background: var(--bg); border-radius: 52px; overflow: hidden; display: flex; flex-direction: column; }
  .island { position: absolute; top: 11px; left: 50%; translate: -50% 0; width: 124px; height: 36px; background: #000; border-radius: 20px; z-index: 5; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; padding: 18px 36px 0 44px; display: flex; justify-content: space-between; font: 700 17px var(--font); z-index: 4; }
  .status.light { color: #fff; }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .battery { width: 27px; height: 13px; border: 1.5px solid currentColor; border-radius: 4px; padding: 1.5px; opacity: .9; }
  .battery i { display: block; width: 100%; height: 100%; background: currentColor; border-radius: 1.5px; }
  .content { flex: 1; overflow: hidden; }
  .pad { padding: 0 16px; }

  /* Navigacija: samo ikone, aktivna sa tačkom */
  .nav { display: flex; justify-content: space-around; padding: 8px 6px 30px; background: var(--bg); }
  .nav span { width: 48px; display: grid; justify-items: center; gap: 4px; color: var(--muted); }
  .nav span.on { color: var(--ink); }
  .nav span.on::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
  .nav svg { width: 24px; height: 24px; }

  /* Tipografija iz aplikacije */
  .display-xl { font-size: 48px; line-height: 46px; font-weight: 800; letter-spacing: -.035em; font-variation-settings: "opsz" 96; }
  .display-l { font-size: 44px; line-height: 42px; font-weight: 800; letter-spacing: -.035em; font-variation-settings: "opsz" 96; }
  .display-m { font-size: 32px; line-height: 32px; font-weight: 800; letter-spacing: -.035em; font-variation-settings: "opsz" 96; }
  .label { font-size: 12px; line-height: 16px; font-weight: 700; color: var(--muted); }
  .body { font-size: 15px; line-height: 22px; }
  .strong { font-size: 15px; line-height: 20px; font-weight: 700; }
  .num { font-variant-numeric: tabular-nums; }

  .photo { background: #1F1E1B center / cover no-repeat; }
  .scrim::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, var(--scrim) 70%); }
  .topscrim::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 160px; background: linear-gradient(var(--scrim), transparent); z-index: 1; }
  .round-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--scrim); color: #fff; display: grid; place-items: center; }
  .avatar { border-radius: 50%; background: var(--lilac) center / cover no-repeat; flex: none; }
  .btn { height: 56px; border-radius: 999px; display: grid; place-items: center; font: 700 17px var(--font); }
  .btn.dark { background: var(--ink); color: var(--bg); }
  .btn.light { background: var(--bg); color: var(--ink); }
  .btn.pop { background: var(--lime); color: var(--ink); border: 1.5px solid var(--ink); }
  .btn.outline { border: 1.5px solid var(--ink); }
  .tile { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile .v { font-size: 26px; line-height: 28px; font-weight: 800; letter-spacing: -.03em; margin-top: 4px; }
  .pill { font: 700 10px var(--font); border: 1px solid var(--ink); border-radius: 999px; padding: 2px 7px; }
  .tag-pr { font: 800 11px var(--font); background: var(--ink); color: var(--lime); border-radius: 999px; padding: 3px 8px; }
  /* Story kartica: Instagram story je 1080 × 1920, ovde u pola veličine. */
  .story-frame { width: 540px; height: 960px; background: var(--bg); border-radius: 0; padding: 72px 40px; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 30px 60px -20px rgba(0,0,0,.35); flex: none; }
  body.clean .story-frame { box-shadow: none; }
  .sticker { position: absolute; top: -8px; right: 14px; background: var(--ink); color: var(--lime); font: 800 12px var(--font); padding: 6px 12px; border-radius: 999px; rotate: 6deg; z-index: 2; }
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<div class="stage" id="stage"></div>

<script>
const T = TRAINER;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bg = (url) => url ? `background-image:url('${String(url).replace(/'/g, "%27")}')` : "";
const initials = (n) => n.trim().split(/\s+/).map((p) => p[0]).slice(0, 2).join("").toUpperCase();

const icon = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  compass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',
  books: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><path d="M16 5.5l3.5-1 2.5 15-3.5 1z"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>',
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>'
};

const status = (light) => `<div class="island"></div><div class="status ${light ? "light" : ""}"><span>9:41</span><span class="icons">
  <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
  <span class="battery"><i></i></span></span></div>`;

const nav = (active) => `<div class="nav">${["sun", "cal", "compass", "books", "user"].map((k, i) => `<span class="${i === active ? "on" : ""}">${icon[k]}</span>`).join("")}</div>`;

const avatar = (size) => `<span class="avatar" style="width:${size}px;height:${size}px;${bg(T.avatar || T.photo)}"></span>`;

// ───────── Ekran 1: profil trenera
function profileScreen() {
  const programs = T.programs.map((p) => `
    <div style="display:grid;gap:10px">
      <div class="photo scrim" style="position:relative;height:220px;border-radius:28px;${bg(p.cover)}">
        <div style="position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff">
          <div class="strong" style="font-size:13px">${esc(p.weeks)} nedelja · ${esc(p.perWeek)}× nedeljno</div>
          <div class="display-m" style="margin-top:2px">${esc(p.name)}</div>
        </div>
        ${p.forSubscribers ? `<span style="position:absolute;top:12px;right:12px;z-index:1" class="round-btn"><span style="width:18px;height:18px">${icon.lock}</span></span>` : ""}
      </div>
      <div class="label" style="color:var(--ink)">${esc(p.level)} · ${esc(p.place)}${p.forSubscribers ? " · za pretplatnike" : ""}</div>
    </div>`).join("");
  return `${status(true)}
  <div class="content">
    <div class="photo scrim" style="position:relative;height:430px;border-radius:0 0 28px 28px;${bg(T.photo)}">
      <span class="round-btn" style="position:absolute;top:62px;left:16px;z-index:1"><span style="width:20px;height:20px">${icon.back}</span></span>
      <div style="position:absolute;left:16px;right:16px;bottom:18px;z-index:1;color:#fff">
        <div class="label" style="color:#fff">@${esc(T.handle)} · ${esc(T.tagline)}</div>
        <div class="display-l" style="margin-top:4px">${esc(T.name)}</div>
      </div>
    </div>
    <div class="pad" style="display:grid;gap:16px;margin-top:16px">
      <p class="body" style="color:var(--ink)">${esc(T.bio)}</p>
      <div class="tiles">
        <div class="tile"><div class="label">Pratioci</div><div class="v num">${esc(T.followers)}</div></div>
        <div class="tile"><div class="label">Programi</div><div class="v num">${T.programs.length}</div></div>
        <div class="tile"><div class="label">Mesečno</div><div class="v num" style="font-size:22px">${esc(T.priceMonthly)}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:8px">
        <div class="btn pop" style="height:48px">Pretplati se</div>
        <div class="btn outline" style="height:48px;padding:0 22px">Zaprati</div>
      </div>
      <div class="display-m" style="font-size:26px;margin-top:8px">Programi</div>
      ${programs}
    </div>
  </div>`;
}

// ───────── Ekran 2: program
function programScreen() {
  const p = T.programs[0];
  const rows = (p.workouts || []).map((w, i) => `
    <div class="tile" style="display:flex;gap:12px;align-items:center;padding:10px 14px 10px 10px">
      <span class="photo" style="width:60px;height:60px;border-radius:14px;flex:none;${bg(w.cover)}"></span>
      <div style="flex:1;min-width:0">
        <div class="strong">${esc(w.name)}</div>
        <div class="body" style="font-size:13px;line-height:18px;color:var(--muted)">${esc(w.exercises)} vežbi · ~${esc(w.minutes)} min</div>
      </div>
      <span class="label num" style="color:var(--ink)">0${i + 1}</span>
    </div>`).join("");
  return `${status(true)}
  <div class="content">
    <div class="photo scrim" style="position:relative;height:330px;border-radius:0 0 28px 28px;${bg(p.cover)}">
      <span class="round-btn" style="position:absolute;top:62px;left:16px;z-index:1"><span style="width:20px;height:20px">${icon.back}</span></span>
      <div style="position:absolute;left:16px;right:16px;bottom:18px;z-index:1;color:#fff">
        <div class="label" style="color:#fff">${esc(T.name)} · ${esc(p.weeks)} nedelja · ${esc(p.perWeek)}× nedeljno</div>
        <div class="display-l" style="margin-top:4px">${esc(p.name)}</div>
      </div>
    </div>
    <div class="pad" style="display:grid;gap:12px;margin-top:16px">
      <div class="tiles">
        <div class="tile"><div class="label">Nedelje</div><div class="v num">${esc(p.weeks)}</div></div>
        <div class="tile"><div class="label">Nedeljno</div><div class="v num">${esc(p.perWeek)}×</div></div>
        <div class="tile"><div class="label">Nivo</div><div class="v" style="font-size:17px;line-height:22px">${esc(p.level)}</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px">${avatar(28)}<span class="strong">${esc(T.name)}</span><span class="label" style="margin-left:auto">${esc(T.followers)} pratilaca</span></div>
      <div class="display-m" style="font-size:22px;margin-top:8px">Treninzi u rotaciji</div>
      ${rows}
    </div>
  </div>
  <div class="pad" style="padding-bottom:12px"><div class="btn dark">Počni program</div></div>
  ${nav(-1)}`;
}

// ───────── Ekran 3: Danas (kako pratilac vidi trenera svaki dan)
function todayScreen() {
  const d = T.today;
  const days = ["P", "U", "S", "Č", "P", "S", "N"];
  const marks = ["done", "", "done", "", "today", "plan", ""];
  const dots = days.map((l, i) => {
    const m = marks[i];
    const style = m === "done" ? "background:var(--ink);border-color:var(--ink);color:var(--bg)"
      : m === "today" ? "border:2.5px solid var(--ink)" : m === "plan" ? "border-color:var(--ink)" : "";
    const inner = m === "done" ? `<span style="width:15px;height:15px">${icon.check}</span>` : m === "plan" ? '<span style="width:6px;height:6px;border-radius:50%;background:var(--ink)"></span>' : "";
    return `<div style="display:grid;justify-items:center;gap:4px"><span style="width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;${style}">${inner}</span><span class="label" style="${m === "today" ? "color:var(--ink)" : ""}">${l}</span></div>`;
  }).join("");
  return `${status(true)}
  <div class="content">
    <div class="photo scrim topscrim" style="position:relative;height:540px;border-radius:0 0 28px 28px;${bg(d.cover)}">
      <div style="position:absolute;top:62px;left:16px;right:8px;z-index:2;display:flex;align-items:center;color:#fff">
        <span class="strong" style="flex:1;font-size:14px">Petak · Zdravo, ${esc(d.followerName)}</span>
        <span class="round-btn"><span style="width:20px;height:20px">${icon.more}</span></span>
      </div>
      <div style="position:absolute;left:16px;right:16px;bottom:16px;z-index:1;color:#fff;display:grid;gap:6px">
        <div style="display:flex;align-items:center;gap:8px">${avatar(28)}<span class="strong" style="font-size:14px">${esc(T.name)}</span></div>
        <div class="display-xl">${esc(d.workout)}</div>
        <div class="body">~${esc(d.minutes)} min</div>
        <div class="btn light" style="margin-top:10px">Počni</div>
      </div>
    </div>
    <div class="pad" style="margin-top:16px;display:grid;gap:12px">
      <div style="display:flex;justify-content:space-between">${dots}</div>
      <div class="body" style="color:var(--muted)">2 od 3 ove nedelje · 4 nedelje zaredom</div>
      <div style="display:flex;gap:12px;align-items:flex-start;margin-top:8px">${avatar(40)}<div class="strong" style="font-size:17px;line-height:24px">„${esc(d.intro)}”</div></div>
    </div>
  </div>
  ${nav(0)}`;
}

// ───────── Ekran 4: trening set po set
function workoutScreen() {
  const e = T.exercise;
  const seg = Array.from({ length: 5 }, (_, i) => `<i style="flex:1;height:6px;border-radius:3px;background:${i === 0 ? "var(--muted)" : "var(--border)"}"></i>`).join("");
  const stepper = (value, unit) => `<div style="display:flex;align-items:center">
      <span style="width:56px;height:56px;border-radius:50%;background:var(--raised);display:grid;place-items:center"><span style="width:24px;height:24px">${icon.minus}</span></span>
      <div style="flex:1;text-align:center"><div class="num" style="font-size:40px;line-height:42px;font-weight:800;letter-spacing:-.03em">${esc(value)}</div><div class="label">${unit}</div></div>
      <span style="width:56px;height:56px;border-radius:50%;background:var(--raised);display:grid;place-items:center"><span style="width:24px;height:24px">${icon.plus}</span></span>
    </div>`;
  const line = (n, label, done) => `<div style="display:flex;align-items:center;padding:8px">
      <span class="strong num" style="width:24px;color:${done ? "var(--ink)" : "var(--muted)"}">${n}</span>
      <span class="strong num" style="flex:1;color:${done ? "var(--ink)" : "var(--muted)"}">${label}</span>
      <span style="width:22px;height:22px;border-radius:50%;display:grid;place-items:center;${done ? "background:var(--ink);color:var(--bg)" : "border:1.5px solid var(--border)"}">${done ? `<span style="width:13px;height:13px">${icon.check}</span>` : ""}</span>
    </div>`;
  return `${status(false)}
  <div class="content">
    <div style="display:flex;align-items:center;gap:8px;padding:56px 8px 0">
      <span style="width:48px;height:48px;display:grid;place-items:center"><span style="width:24px;height:24px">${icon.close}</span></span>
      <span style="flex:1;display:flex;gap:4px">${seg}</span>
      <span style="width:48px;height:48px;display:grid;place-items:center"><span style="width:24px;height:24px">${icon.more}</span></span>
    </div>
    <div class="pad" style="display:grid;gap:12px;margin-top:8px">
      <div style="display:flex;gap:12px;align-items:center">
        <span class="photo" style="position:relative;width:64px;height:64px;border-radius:14px;flex:none;${bg(e.picture)}"><span class="round-btn" style="position:absolute;inset:18px;width:28px;height:28px"><span style="width:12px;height:12px">${icon.play}</span></span></span>
        <div><div class="display-m">${esc(e.name)}</div><div class="body" style="font-size:14px;color:var(--muted)">${esc(e.sets)} × ${esc(e.reps)} · odmor ${esc(e.rest)}</div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">${avatar(24)}<span class="body" style="font-size:14px;color:var(--muted)">${esc(e.cue)}</span></div>
      <div style="margin-top:12px;background:var(--surface);border:1.5px solid var(--ink);border-radius:28px;padding:12px 16px 16px;display:grid;gap:12px">
        <div style="display:flex"><span class="strong" style="flex:1">Set 2 od ${esc(e.sets)}</span><span class="label">Prošli put ${esc(e.kg)} kg × ${esc(e.repsNow)}</span></div>
        ${stepper(e.kg, "kg")}
        ${stepper(e.repsNow, "ponavljanja")}
      </div>
      <div>${line(1, `${esc(e.kg)} kg × ${esc(e.repsNow)}`, true)}${line(3, `${esc(e.kg)} kg × ${esc(e.repsNow)}`, false)}</div>
    </div>
  </div>
  <div class="pad" style="display:grid;gap:8px;padding-bottom:34px">
    <div style="background:var(--ink);color:var(--bg);border-radius:20px;padding:12px 12px 12px 16px;display:grid;gap:10px">
      <div style="display:flex;align-items:center"><div><div class="label" style="color:rgba(250,248,244,.7)">Odmor</div><div class="num" style="font-size:26px;line-height:28px;font-weight:800">1:12</div></div>
        <span class="strong" style="margin-left:auto;padding:0 8px">+15 s</span><span class="strong" style="padding:0 8px">Preskoči</span></div>
      <div style="height:4px;border-radius:3px;background:rgba(250,248,244,.2)"><i style="display:block;width:20%;height:100%;border-radius:3px;background:var(--bg)"></i></div>
    </div>
    <div class="btn dark">Završi set</div>
  </div>`;
}

// ───────── Story kartica (ista kao u aplikaciji, lib/ui/components/summary.dart)
function shareCard(scale = 1) {
  const m = T.summary;
  const tile = (label, value, bgc, fg, big) => `<div style="background:${bgc};color:${fg};border-radius:${20 * scale}px;padding:${14 * scale}px">
      <div class="label" style="color:${fg};font-size:${12 * scale}px;line-height:${16 * scale}px">${label}</div>
      <div class="num" style="font-weight:800;letter-spacing:-.03em;white-space:nowrap;font-size:${(big ? 40 : 26) * scale}px;line-height:${(big ? 42 : 28) * scale}px">${esc(value)}</div>
    </div>`;
  const second = m.records > 0 ? tile("Rekordi", `${m.records} PR`, "var(--peach)", "var(--ink)") : tile("Setova", m.sets ?? "—", "var(--peach)", "var(--ink)");
  return `<div style="background:var(--lilac);border-radius:${28 * scale}px;padding:${24 * scale}px ${20 * scale}px ${20 * scale}px;color:var(--ink)">
    <div class="strong" style="font-size:${13 * scale}px;line-height:${18 * scale}px">${esc(m.workout)} · ${esc(m.duration)}</div>
    <div style="font-size:${56 * scale}px;line-height:${54 * scale}px;font-weight:800;letter-spacing:-.04em;font-variation-settings:'opsz' 96;margin-top:${8 * scale}px">${esc(m.headline)}</div>
    <div style="display:grid;gap:${8 * scale}px;margin-top:${24 * scale}px">
      ${tile("Volumen", m.volume, "var(--lime)", "var(--ink)", true)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:${8 * scale}px">${second}${tile("Niz", m.streak, "var(--ink)", "#fff")}</div>
    </div>
    <div style="display:flex;align-items:center;gap:${8 * scale}px;margin-top:${24 * scale}px">
      <span class="avatar" style="width:${28 * scale}px;height:${28 * scale}px;${bg(T.avatar || T.photo)}"></span>
      <span class="strong" style="flex:1;font-size:${13 * scale}px">@${esc(T.handle)}</span>
      <span class="strong" style="font-size:${13 * scale}px">Chalkline</span>
    </div>
  </div>`;
}

// ───────── Ekran 5: rezime posle treninga
function summaryScreen() {
  const m = T.summary;
  const rows = m.exercises.map((x) => `<div class="tile" style="display:flex;align-items:center;gap:10px;padding:12px 14px">
      <div style="flex:1"><div class="strong">${esc(x.name)}</div><div class="body" style="font-size:13px;line-height:18px;color:var(--muted)">${esc(x.detail)}</div></div>
      ${x.pr ? '<span class="tag-pr">PR</span>' : ""}
    </div>`).join("");
  return `${status(false)}
  <div class="content">
    <div style="padding:58px 8px 0"><span style="width:48px;height:48px;display:grid;place-items:center"><span style="width:24px;height:24px">${icon.back}</span></span></div>
    <div class="pad" style="display:grid;gap:12px">
      ${shareCard(0.86)}
      <div class="tile" style="display:flex;gap:12px;align-items:flex-start">
        ${avatar(36)}
        <div><div class="label">Poruka · ${esc(T.name)}</div><div class="body" style="margin-top:2px">${esc(m.finishMessage)}</div></div>
      </div>
      <div class="display-m" style="font-size:22px;margin-top:6px">Vežbe</div>
      ${rows}
    </div>
  </div>
  <div class="pad" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:34px;padding-top:10px">
    <div class="btn pop">Podeli na story</div>
    <div class="btn dark">Gotovo</div>
  </div>`;
}

// ───────── Story za Instagram: samo kartica, 9:16
function storyFrame() {
  return `<div class="story-frame" id="story">${shareCard(1.6)}</div>`;
}

const SCREENS = [
  { id: "profil", title: "Profil trenera", render: profileScreen },
  { id: "program", title: "Program", render: programScreen },
  { id: "danas", title: "Danas, kod pratioca", render: todayScreen },
  { id: "trening", title: "Trening", render: workoutScreen },
  { id: "rezime", title: "Rezime", render: summaryScreen },
  { id: "story", title: "Story 9:16", render: storyFrame, bare: true }
];

let only = null;
function draw() {
  document.getElementById("stage").innerHTML = SCREENS
    .filter((s) => !only || s.id === only)
    .map((s) => s.bare
      ? `<div class="slot">${s.render()}<div class="caption">${s.title}</div></div>`
      : `<div class="slot"><div class="phone" id="${s.id}"><div class="screen">${s.render()}</div></div><div class="caption">${s.title}</div></div>`)
    .join("");
  document.getElementById("toolbar").innerHTML =
    `<button class="${only ? "" : "on"}" data-only="">Svi ekrani</button>` +
    SCREENS.map((s) => `<button class="${only === s.id ? "on" : ""}" data-only="${s.id}">${s.title}</button>`).join("") +
    `<button data-clean>${document.body.classList.contains("clean") ? "Sa pozadinom" : "Bez pozadine"}</button>`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.hasAttribute("data-clean")) document.body.classList.toggle("clean");
  else only = b.dataset.only || null;
  draw();
});
draw();
</script>
